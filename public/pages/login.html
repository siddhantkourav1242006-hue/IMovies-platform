<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — IMovies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar" id="navbar">
    <a href="/" class="navbar-brand"><i class="fas fa-film"></i> <span>I</span>Movies</a>
    <div class="nav-links">
      <a href="/" class="nav-link">Home</a>
    </div>
    <div class="nav-auth" id="nav-auth"></div>
  </nav>

  <div id="toast-container"></div>

  <main class="container" style="display:flex; align-items:center; justify-content:center; min-height:85vh; margin-top:70px;">
    <div class="checkout-card" style="max-width:440px; width:100%; padding:2.5rem;">
      <div style="text-align:center; margin-bottom:2rem;">
        <i class="fas fa-film fa-3x" style="color:var(--accent); margin-bottom:0.8rem;"></i>
        <h2 style="font-size:1.8rem; font-weight:800; color:#fff;">Welcome Back</h2>
        <p style="color:var(--text-muted); font-size:0.9rem; margin-top:0.3rem;">Sign in to manage your tickets and wishlist</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required/>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:1.5rem;">
          Sign In
        </button>
      </form>

      <div style="text-align:center; margin-top:1.8rem; font-size:0.9rem; color:var(--text-secondary);">
        Don't have an account? <a href="/pages/register.html" style="color:var(--accent); font-weight:600;">Sign up</a>
      </div>

      <div style="margin-top:2rem; padding:1rem; background:var(--bg-input); border-radius:var(--radius-sm); font-size:0.78rem; color:var(--text-muted);">
        <strong>Demo Credentials:</strong><br/>
        User: john@test.com / Test@123<br/>
        Admin: admin@imovies.com / Admin@123
      </div>
    </div>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
