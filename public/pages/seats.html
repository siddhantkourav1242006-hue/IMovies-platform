<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Seats — IMovies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar" id="navbar">
    <a href="/" class="navbar-brand"><i class="fas fa-film"></i> <span>I</span>Movies</a>
    <div class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/pages/bookings.html" class="nav-link">My Bookings</a>
      <a href="/pages/wishlist.html" class="nav-link">Wishlist</a>
    </div>
    <div class="nav-auth" id="nav-auth"></div>
  </nav>

  <div id="toast-container"></div>

  <!-- Header Info Bar -->
  <div style="background:var(--bg-secondary); border-bottom:1px solid var(--border); margin-top:70px; padding:1rem 0;">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.8rem;">
      <div>
        <h2 id="info-movie-title" style="font-size:1.2rem; font-weight:700; color:#fff;">Loading...</h2>
        <p id="info-theater" style="font-size:0.85rem; color:var(--text-muted);"></p>
      </div>
      <div id="info-datetime" style="font-size:0.95rem; font-weight:600; color:var(--accent);"></div>
    </div>
  </div>

  <main class="container seat-booking-view">
    <!-- Cinema Screen Indicator -->
    <div class="screen-indicator-wrap">
      <div class="screen-curve"></div>
      <div class="screen-label">ALL EYES THIS WAY — CINEMA SCREEN</div>
    </div>

    <!-- Real-time Seat Matrix -->
    <div class="seat-map-container" id="seat-map-container"></div>

    <!-- Seat Legend -->
    <div class="seat-legend">
      <div class="legend-item">
        <div class="legend-box" style="background:rgba(52,211,153,0.15); border:1px solid rgba(52,211,153,0.4);"></div>
        <span>Standard (₹150)</span>
      </div>
      <div class="legend-item">
        <div class="legend-box" style="background:rgba(168,85,247,0.15); border:1px solid rgba(168,85,247,0.4);"></div>
        <span>Premium (₹250)</span>
      </div>
      <div class="legend-item">
        <div class="legend-box" style="background:rgba(251,191,36,0.15); border:1px solid rgba(251,191,36,0.4);"></div>
        <span>VIP Recliner (₹400)</span>
      </div>
      <div class="legend-item">
        <div class="legend-box" style="background:var(--accent); box-shadow:0 0 8px var(--accent);"></div>
        <span>Selected</span>
      </div>
      <div class="legend-item">
        <div class="legend-box" style="background:#23232c; border:1px solid #333342;"></div>
        <span>Booked</span>
      </div>
    </div>

    <!-- Food & Beverages Panel -->
    <div class="fnb-panel">
      <h3 style="font-size:1.2rem; font-weight:700; color:#fff; margin-bottom:1.2rem;">
        🍿 Grab a Bite (Food & Drinks)
      </h3>
      <div id="fnb-grid-container"></div>
    </div>
  </main>

  <!-- Sticky Bottom Summary Bar -->
  <div class="booking-summary-bar" id="booking-summary-bar">
    <div class="summary-details">
      <div style="font-size:0.85rem; color:var(--text-muted);" id="seats-count">0 Seats</div>
      <div class="selected-seats-pills" id="selected-seats-pills"></div>
    </div>
    <div style="display:flex; align-items:center; gap:1.5rem;">
      <div style="text-align:right;">
        <div style="font-size:0.75rem; color:var(--text-muted);">Total Payable</div>
        <div class="summary-total" id="subtotal-amount">₹0</div>
      </div>
      <button class="btn btn-primary btn-lg" id="btn-proceed-checkout">
        Proceed <i class="fas fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/seatSelection.js"></script>
</body>
</html>
