<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — IMovies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar" id="navbar">
    <a href="/" class="navbar-brand"><i class="fas fa-film"></i> <span>I</span>Movies</a>
    <div class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/pages/bookings.html" class="nav-link">My Bookings</a>
      <a href="/pages/wishlist.html" class="nav-link">Wishlist</a>
    </div>
    <div class="nav-auth" id="nav-auth"></div>
  </nav>

  <div id="toast-container"></div>

  <main class="container" style="max-width:750px; margin-top:100px; padding-bottom:4rem;">
    <!-- Profile Card Header -->
    <div class="checkout-card" style="margin-bottom:2rem; display:flex; align-items:center; gap:1.8rem; padding:2rem;">
      <div class="user-avatar" id="profile-avatar-big" style="width:75px; height:75px; font-size:2rem;">U</div>
      <div>
        <h2 id="profile-name-header" style="font-size:1.6rem; font-weight:800; color:#fff;">User Name</h2>
        <p id="profile-email-header" style="color:var(--text-muted); font-size:0.95rem;"></p>
        <span class="badge" style="background:var(--accent-glow); color:var(--accent); border-color:var(--accent); margin-top:0.6rem; display:inline-block;">
          Verified Cinema Member
        </span>
      </div>
    </div>

    <!-- Edit Form -->
    <div class="checkout-card">
      <h3 style="font-size:1.2rem; font-weight:700; color:#fff; margin-bottom:1.5rem;">Edit Personal Details</h3>
      <form id="profile-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="input-name" class="form-control" required/>
        </div>
        <div class="form-group">
          <label>Email Address (Account Identifier)</label>
          <input type="email" id="input-email" class="form-control" disabled style="opacity:0.6; cursor:not-allowed;"/>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="input-phone" class="form-control"/>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:1rem;">Save Changes</button>
      </form>
    </div>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
