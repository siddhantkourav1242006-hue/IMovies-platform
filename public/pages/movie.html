<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Details — IMovies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar" id="navbar">
    <a href="/" class="navbar-brand"><i class="fas fa-film"></i> <span>I</span>Movies</a>
    <div class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/pages/bookings.html" class="nav-link">My Bookings</a>
      <a href="/pages/wishlist.html" class="nav-link">Wishlist</a>
    </div>
    <div class="nav-auth" id="nav-auth"></div>
    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
  </nav>

  <div class="nav-mobile" id="nav-mobile"></div>
  <div id="toast-container"></div>

  <!-- Hero Backdrop Section -->
  <section class="movie-hero-banner" id="movie-hero">
    <div class="movie-hero-overlay"></div>
    <div class="container movie-detail-wrap">
      <div class="detail-poster">
        <img id="detail-poster-img" src="" alt="Movie Poster"/>
      </div>
      <div class="detail-content">
        <div class="detail-meta-list" id="detail-badges"></div>
        <h1 class="detail-title" id="detail-title">Loading...</h1>
        <div class="detail-actions">
          <a href="#" id="btn-book-tickets" class="btn btn-primary btn-lg">
            <i class="fas fa-ticket-alt"></i> Select Showtimes
          </a>
          <button id="btn-watch-trailer" class="btn btn-secondary btn-lg">
            <i class="fas fa-play"></i> Watch Trailer
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Detailed Specs & Reviews -->
  <main class="container content-section">
    <h2 class="section-title"><i class="fas fa-align-left"></i> Synopsis</h2>
    <p class="synopsis-text" id="detail-synopsis"></p>

    <div style="margin-top: 3.5rem;">
      <h2 class="section-title"><i class="fas fa-users"></i> Cast & Crew</h2>
      <div class="cast-scroll" id="cast-container"></div>
    </div>

    <!-- User Reviews & Community Rating -->
    <div style="margin-top: 4rem;">
      <h2 class="section-title"><i class="fas fa-star"></i> Audience Reviews</h2>
      
      <!-- Review Submission Card -->
      <div class="theater-card" style="margin-bottom:2rem;">
        <h4 style="color:#fff; margin-bottom:1rem;">Leave a Review</h4>
        <form id="review-form">
          <div style="display:flex; gap:1rem; margin-bottom:1rem; align-items:center;">
            <label style="color:var(--text-secondary); font-size:0.9rem;">Rating:</label>
            <select id="review-rating-select" class="form-control" style="width:140px;">
              <option value="5">★★★★★ (5/5)</option>
              <option value="4">★★★★☆ (4/5)</option>
              <option value="3">★★★☆☆ (3/5)</option>
              <option value="2">★★☆☆☆ (2/5)</option>
              <option value="1">★☆☆☆☆ (1/5)</option>
            </select>
          </div>
          <div class="form-group">
            <textarea id="review-comment-input" class="form-control" rows="3" placeholder="What did you think of the story, acting, and music?" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-sm">Post Review</button>
        </form>
      </div>

      <div id="reviews-list"></div>
    </div>
  </main>

  <!-- Trailer Modal -->
  <div class="modal-overlay" id="trailer-modal">
    <div class="modal" style="max-width:850px; background:#000;">
      <div class="modal-header" style="border:none;">
        <h4 style="color:#fff;">Official Movie Trailer</h4>
        <button class="close-modal" id="close-trailer-modal"><i class="fas fa-times"></i></button>
      </div>
      <div style="aspect-ratio:16/9; width:100%;">
        <iframe id="trailer-iframe" width="100%" height="100%" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-bottom">&copy; 2026 IMovies. All rights reserved.</div>
  </footer>

  <script src="/js/utils.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/movieDetail.js"></script>
  <script src="/js/review.js"></script>
</body>
</html>
