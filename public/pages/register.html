<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — IMovies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar" id="navbar">
    <a href="/" class="navbar-brand"><i class="fas fa-film"></i> <span>I</span>Movies</a>
    <div class="nav-links">
      <a href="/" class="nav-link">Home</a>
    </div>
    <div class="nav-auth" id="nav-auth"></div>
  </nav>

  <div id="toast-container"></div>

  <main class="container" style="display:flex; align-items:center; justify-content:center; min-height:85vh; margin-top:70px; padding:2rem 0;">
    <div class="checkout-card" style="max-width:480px; width:100%; padding:2.5rem;">
      <div style="text-align:center; margin-bottom:2rem;">
        <i class="fas fa-ticket-alt fa-3x" style="color:var(--accent); margin-bottom:0.8rem;"></i>
        <h2 style="font-size:1.8rem; font-weight:800; color:#fff;">Create Your Account</h2>
        <p style="color:var(--text-muted); font-size:0.9rem; margin-top:0.3rem;">Unlock exclusive cinema discounts and fast booking</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" required/>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required/>
        </div>
        <div class="form-group">
          <label>Phone Number (Optional)</label>
          <input type="tel" id="phone" class="form-control" placeholder="+91 9876543210"/>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" minlength="6" required/>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" minlength="6" required/>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:1rem;">
          Register Now
        </button>
      </form>

      <div style="text-align:center; margin-top:1.8rem; font-size:0.9rem; color:var(--text-secondary);">
        Already have an account? <a href="/pages/login.html" style="color:var(--accent); font-weight:600;">Sign in</a>
      </div>
    </div>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
